<meta charset="utf-8">
<title>Homeostudy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ─── tokens ─────────────────────────────────────────────────────────── */
:root{
  --paper:#FBF6F9; --surface:#FFFFFF; --surface-2:#F5EEF4; --sunken:#EFE6EE;
  --ink:#191430; --ink-2:#4C4568; --ink-3:#7E7699; --line:#E7DBE7; --line-2:#D6C7D8;
  --azul:#2F5FE0; --azul-esc:#1B3A9E; --azul-wash:#E4EBFF;
  --rosa:#E23C7C; --rosa-esc:#AE2359; --rosa-wash:#FFE1EC;
  --noite:#120D26; --noite-ink:#EDE6F5; --noite-ink-2:#B6ACD2; --noite-line:#332A5E; --noite-3:#9A8FC0;
  --ok:#1B8C6C; --ok-wash:#DEF3EC; --alerta:#C97A10; --alerta-wash:#FBEDD6;
  --crit:#CE3448; --crit-wash:#FBE0E4;
  --shadow:0 1px 2px rgba(25,20,48,.05), 0 8px 24px -12px rgba(25,20,48,.18);
  --shadow-lift:0 2px 4px rgba(25,20,48,.06), 0 18px 40px -18px rgba(45,25,70,.35);
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --wrap:1180px; --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F0A21; --surface:#191233; --surface-2:#211946; --sunken:#140E2C;
    --ink:#F2ECF9; --ink-2:#C4BADF; --ink-3:#8F85AF; --line:#2E2559; --line-2:#3D3272;
    --azul:#8AA6FF; --azul-esc:#B9C8FF; --azul-wash:#1C2456;
    --rosa:#FF7CAC; --rosa-esc:#FFB0CC; --rosa-wash:#3E1730;
    --noite:#0A0619; --noite-line:#2A2050;
    --ok:#4FCCA5; --ok-wash:#0F3830; --alerta:#E8A94A; --alerta-wash:#3B2A10;
    --crit:#FF7488; --crit-wash:#3E1420;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.8);
    --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 22px 48px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#0F0A21; --surface:#191233; --surface-2:#211946; --sunken:#140E2C;
  --ink:#F2ECF9; --ink-2:#C4BADF; --ink-3:#8F85AF; --line:#2E2559; --line-2:#3D3272;
  --azul:#8AA6FF; --azul-esc:#B9C8FF; --azul-wash:#1C2456;
  --rosa:#FF7CAC; --rosa-esc:#FFB0CC; --rosa-wash:#3E1730;
  --noite:#0A0619; --noite-line:#2A2050;
  --ok:#4FCCA5; --ok-wash:#0F3830; --alerta:#E8A94A; --alerta-wash:#3B2A10;
  --crit:#FF7488; --crit-wash:#3E1420;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.8);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 22px 48px -20px rgba(0,0,0,.9);
}

/* ─── base ───────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
body{background:var(--paper); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.62; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display); font-weight:800; line-height:1.12; margin:0; text-wrap:balance; letter-spacing:-.015em}
p{margin:0}
a{color:var(--azul)}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
:focus-visible{outline:2.5px solid var(--rosa); outline-offset:3px; border-radius:4px}
.wrap{max-width:var(--wrap); margin:0 auto; padding:0 22px}
.kicker{font-family:var(--mono); font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--ink-3)}

/* ─── header ─────────────────────────────────────────────────────────── */
.top{position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter:blur(14px) saturate(1.4); border-bottom:1px solid var(--line)}
.top-in{display:flex; align-items:center; gap:16px; height:62px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); flex:none}
.brand-mark{width:26px; height:26px; flex:none}
.brand-name{font-family:var(--display); font-weight:800; font-size:19px; letter-spacing:-.03em}
.brand-name em{font-style:normal; color:var(--rosa)}
.nav{display:flex; gap:3px; overflow-x:auto; scrollbar-width:none; margin-left:auto; padding:4px 0}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none; padding:7px 12px; border-radius:999px; font-family:var(--display); font-size:13px; font-weight:600; color:var(--ink-2); white-space:nowrap; transition:background .18s, color .18s, transform .18s}
.nav button:hover{background:var(--surface-2); color:var(--ink); transform:translateY(-1px)}
.nav button[aria-current="true"]{background:var(--ink); color:var(--paper)}
.nav button.is-ask[aria-current="true"]{background:var(--rosa); color:#fff}
.theme-btn{flex:none; width:34px; height:34px; border-radius:10px; display:grid; place-items:center; color:var(--ink-2); transition:background .18s}
.theme-btn:hover{background:var(--surface-2)}

/* ─── animação ───────────────────────────────────────────────────────── */
.view{animation:rise .4s cubic-bezier(.22,.9,.28,1) both}
@keyframes rise{from{opacity:0; transform:translateY(13px)} to{opacity:1; transform:none}}
.stagger>*{animation:rise .48s cubic-bezier(.22,.9,.28,1) both}
.stagger>*:nth-child(1){animation-delay:.02s} .stagger>*:nth-child(2){animation-delay:.06s}
.stagger>*:nth-child(3){animation-delay:.10s} .stagger>*:nth-child(4){animation-delay:.14s}
.stagger>*:nth-child(5){animation-delay:.18s} .stagger>*:nth-child(6){animation-delay:.22s}
.stagger>*:nth-child(7){animation-delay:.26s} .stagger>*:nth-child(8){animation-delay:.30s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms !important; transition-duration:.001ms !important}}

/* ─── hero ───────────────────────────────────────────────────────────── */
.hero{position:relative; background:var(--noite); color:var(--noite-ink); overflow:hidden; border-bottom:1px solid var(--noite-line)}
.hero canvas{position:absolute; inset:0; width:100%; height:100%; opacity:.5}
.hero-in{position:relative; padding-block:60px 54px; display:grid; gap:24px}
.eyebrow{font-family:var(--mono); font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--rosa); display:flex; align-items:center; gap:9px}
.eyebrow::before{content:""; width:26px; height:1.5px; background:var(--rosa)}
.hero h1{font-size:clamp(36px,6vw,66px); max-width:15ch; color:#fff}
.hero h1 em{font-style:normal; background:linear-gradient(96deg,#FF8FBB,#8FAAFF); -webkit-background-clip:text; background-clip:text; color:transparent}
.citacao{position:relative; max-width:60ch; padding-left:26px; margin-top:2px}
.citacao::before{content:"“"; position:absolute; left:-6px; top:-16px; font-family:var(--body); font-size:74px; line-height:1; color:var(--rosa); opacity:.5}
.citacao blockquote{margin:0; font-size:clamp(18px,2.2vw,21px); line-height:1.55; color:#F0EAFA; font-style:italic}
.citacao cite{display:block; margin-top:13px; font-style:normal; font-family:var(--mono); font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--rosa)}
.citacao cite span{display:block; margin-top:3px; letter-spacing:.06em; text-transform:none; color:var(--noite-3)}

/* ─── seções e cards de matéria ──────────────────────────────────────── */
.sec{padding-block:50px}
.sec-head{display:flex; align-items:baseline; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:20px}
.sec-head h2{font-size:clamp(24px,3.2vw,32px)}
.grid-mat{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
.matcard{position:relative; text-align:left; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px 22px 18px; display:grid; gap:9px; align-content:start; transition:transform .25s cubic-bezier(.22,.9,.28,1), box-shadow .25s, border-color .25s; box-shadow:var(--shadow); overflow:hidden}
.matcard::after{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:linear-gradient(180deg,var(--rosa),var(--azul)); transform:scaleY(0); transform-origin:top; transition:transform .35s cubic-bezier(.22,.9,.28,1)}
.matcard:hover{transform:translateY(-4px); box-shadow:var(--shadow-lift); border-color:var(--line-2)}
.matcard:hover::after{transform:scaleY(1)}
.matcard .num{font-family:var(--mono); font-size:11px; color:var(--ink-3); letter-spacing:.1em}
.matcard h3{font-size:20px}
.matcard p{font-size:15px; color:var(--ink-2); line-height:1.5}
.matcard .go{font-family:var(--display); font-weight:600; font-size:13.5px; color:var(--rosa); display:flex; align-items:center; gap:6px; margin-top:2px}
.matcard:hover .go svg{transform:translateX(4px)}
.matcard .go svg{transition:transform .25s}

/* ─── lista de aulas ─────────────────────────────────────────────────── */
.aulas{display:grid; gap:9px}
.aula{display:grid; grid-template-columns:38px 1fr auto; gap:16px; align-items:center; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:15px 18px; box-shadow:var(--shadow); transition:transform .22s, box-shadow .22s, border-color .22s}
.aula:hover{transform:translateX(4px); border-color:var(--rosa); box-shadow:var(--shadow-lift)}
.aula .n{font-family:var(--mono); font-size:13px; font-weight:600; color:var(--rosa); background:var(--rosa-wash); border-radius:8px; height:34px; display:grid; place-items:center}
.aula .tx{display:grid; gap:3px; min-width:0}
.aula h3{font-size:17px; line-height:1.28}
.aula .sub{font-family:var(--mono); font-size:11px; color:var(--ink-3); letter-spacing:.03em}
.aula .meta{display:flex; gap:12px; align-items:center; font-family:var(--mono); font-size:11px; color:var(--ink-3); white-space:nowrap}
.aula .meta b{color:var(--ink-2); font-weight:500}
.aula.off{opacity:.62; border-style:dashed; box-shadow:none; cursor:default}
.aula.off:hover{transform:none; border-color:var(--line); box-shadow:none}
.aula.off .n{background:var(--sunken); color:var(--ink-3)}
@media (max-width:640px){.aula{grid-template-columns:32px 1fr; gap:12px} .aula .meta{grid-column:2; margin-top:4px}}

/* ─── cabeçalho de aula ──────────────────────────────────────────────── */
.mhead{background:var(--noite); color:var(--noite-ink); border-bottom:1px solid var(--noite-line); position:relative; overflow:hidden}
.mhead-in{padding-block:32px 0; position:relative}
.mhead .crumb{font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:var(--noite-3); text-transform:uppercase; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.mhead .crumb button{color:var(--noite-3); font-family:inherit; font-size:inherit; letter-spacing:inherit; text-transform:inherit; transition:color .2s}
.mhead .crumb button:hover{color:#fff}
.mhead h1{font-size:clamp(25px,4vw,40px); color:#fff; margin:10px 0 9px; max-width:24ch}
.mhead p{color:var(--noite-ink-2); max-width:62ch; font-size:16.5px}
.mhead-glow{position:absolute; width:520px; height:520px; right:-150px; top:-270px; border-radius:50%; background:radial-gradient(circle,rgba(226,60,124,.28),transparent 68%); pointer-events:none}
.segs{display:flex; gap:2px; margin-top:26px; overflow-x:auto; scrollbar-width:none}
.segs::-webkit-scrollbar{display:none}
.segs button{flex:none; position:relative; padding:12px 16px 14px; font-family:var(--display); font-weight:600; font-size:14px; color:var(--noite-3); white-space:nowrap; transition:color .2s}
.segs button:hover{color:#DCD3F0}
.segs button[aria-current="true"]{color:#fff}
.segs button::after{content:""; position:absolute; left:10px; right:10px; bottom:0; height:2.5px; border-radius:2px; background:var(--rosa); transform:scaleX(0); transition:transform .3s cubic-bezier(.22,.9,.28,1)}
.segs button[aria-current="true"]::after{transform:scaleX(1)}
.segs .cnt{font-family:var(--mono); font-size:10px; opacity:.75; margin-left:5px}

/* pílulas dos grupos de exercício */
.pills{display:flex; gap:7px; flex-wrap:wrap; margin:26px 0 4px}
.pills button{font-family:var(--display); font-size:13.5px; font-weight:600; padding:8px 15px; border-radius:999px; border:1.5px solid var(--line); color:var(--ink-2); transition:all .2s; display:flex; align-items:center; gap:7px}
.pills button:hover{border-color:var(--rosa); color:var(--rosa)}
.pills button[aria-current="true"]{background:var(--rosa); border-color:var(--rosa); color:#fff}
.pills .cnt{font-family:var(--mono); font-size:10.5px; opacity:.8}

/* ─── conteúdo ───────────────────────────────────────────────────────── */
.doc-layout{display:grid; grid-template-columns:1fr; gap:36px; padding-block:32px 56px}
@media (min-width:1000px){.doc-layout{grid-template-columns:1fr 228px; gap:50px; align-items:start} .toc{position:sticky; top:78px}}
.toc{display:grid; gap:2px; align-content:start}
.toc .tlab{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); margin-bottom:8px}
.toc a{display:block; padding:6px 11px; border-radius:8px; font-size:13.5px; text-decoration:none; color:var(--ink-2); border-left:2px solid transparent; transition:all .18s; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.toc a:hover{background:var(--surface-2); color:var(--ink)}
.toc a.on{color:var(--rosa); border-left-color:var(--rosa); background:var(--rosa-wash)}
@media (max-width:999px){.toc{display:none}}

.doc h2.block-h{font-family:var(--display); font-weight:800; font-size:21px; letter-spacing:-.02em; margin:36px 0 12px; padding-bottom:8px; border-bottom:1.5px solid var(--line); display:flex; align-items:baseline; gap:10px}
.doc h2.block-h:first-child{margin-top:14px}
.doc .pag{font-family:var(--mono); font-size:11px; font-weight:500; color:var(--rosa); letter-spacing:0; flex:none}
.doc p{margin:0 0 12px; max-width:70ch; color:var(--ink-2)}
.doc ul{margin:0 0 15px; padding-left:0; list-style:none; display:grid; gap:8px; max-width:72ch}
.doc ul li{position:relative; padding-left:19px; color:var(--ink-2)}
.doc ul li::before{content:""; position:absolute; left:2px; top:.62em; width:6px; height:6px; border-radius:2px; background:var(--rosa); transform:rotate(45deg)}

/* figuras do material */
.figs{display:grid; grid-template-columns:repeat(auto-fill,minmax(238px,1fr)); gap:13px; margin:18px 0 26px}
.figbox{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow); transition:transform .22s, box-shadow .22s; cursor:zoom-in; display:grid; grid-template-rows:auto 1fr; text-align:left; width:100%; padding:0}
.figbox:hover{transform:translateY(-3px); box-shadow:var(--shadow-lift)}
.figbox img{display:block; width:100%; height:150px; object-fit:cover; background:var(--sunken)}
.figbox figcaption{padding:9px 12px 11px; font-family:var(--mono); font-size:10.5px; line-height:1.45; color:var(--ink-3)}
.figbox figcaption b{display:block; color:var(--ink-2); font-family:var(--body); font-size:13px; font-weight:600; margin-bottom:2px; line-height:1.35}
.figs-lab{display:flex; align-items:center; gap:9px; margin:30px 0 0; font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
.figs-lab::after{content:""; flex:1; height:1px; background:var(--line)}

/* lightbox */
.lbox{position:fixed; inset:0; z-index:90; background:rgba(10,6,25,.92); display:grid; place-items:center; padding:26px; animation:fade .22s both}
@keyframes fade{from{opacity:0} to{opacity:1}}
.lbox img{max-width:100%; max-height:82vh; border-radius:10px; box-shadow:0 30px 80px -20px rgba(0,0,0,.9)}
.lbox .cap{color:#CFC6E4; font-family:var(--mono); font-size:12px; margin-top:14px; text-align:center; max-width:70ch}
.lbox .x{position:absolute; top:18px; right:18px; width:40px; height:40px; border-radius:11px; background:rgba(255,255,255,.12); color:#fff; display:grid; place-items:center; transition:background .2s}
.lbox .x:hover{background:rgba(255,255,255,.24)}

/* ─── exercícios ─────────────────────────────────────────────────────── */
.ex-intro{display:flex; gap:15px; align-items:flex-start; padding:15px 19px; margin:22px 0 20px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.ex-intro .ico{flex:none; width:33px; height:33px; border-radius:9px; display:grid; place-items:center; background:var(--azul-wash); color:var(--azul-esc)}
.ex-intro.pk .ico{background:var(--rosa-wash); color:var(--rosa-esc)}
.ex-intro.al{background:var(--alerta-wash); border-color:var(--alerta)}
.ex-intro.al .ico{background:transparent; color:var(--alerta)}
.ex-intro.al h3, .ex-intro.al p{color:var(--alerta)}
.ex-intro .tx{display:grid; gap:3px}
.ex-intro h3{font-size:16px}
.ex-intro p{font-size:14.5px; color:var(--ink-2); max-width:74ch; line-height:1.55}

.score{display:flex; align-items:center; gap:13px; flex-wrap:wrap; padding:12px 18px; border-radius:var(--r); background:var(--noite); color:#fff; margin-bottom:18px}
.score .sc{font-family:var(--display); font-weight:800; font-size:21px; font-variant-numeric:tabular-nums}
.score .lab{font-family:var(--mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--noite-3)}
.score .track{flex:1; min-width:110px; height:7px; border-radius:4px; background:#2A2050; overflow:hidden}
.score .track i{display:block; height:100%; width:0; border-radius:4px; background:linear-gradient(90deg,#8AA6FF,#FF7CAC); transition:width .6s cubic-bezier(.22,.9,.28,1)}
.score button{font-family:var(--display); font-weight:600; font-size:13px; color:#fff; padding:6px 13px; border-radius:8px; border:1px solid #3D3272; transition:background .2s}
.score button:hover{background:#2A2050}

.q{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:21px 23px; margin-bottom:13px; box-shadow:var(--shadow); transition:border-color .25s}
.q:hover{border-color:var(--line-2)}
.q-top{display:flex; align-items:center; gap:9px; margin-bottom:10px; flex-wrap:wrap}
.q-n{font-family:var(--mono); font-size:11px; font-weight:600; color:var(--rosa); background:var(--rosa-wash); padding:3px 8px; border-radius:6px; letter-spacing:.04em}
.q-tag{font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; padding:3px 7px; border-radius:5px; background:var(--azul-wash); color:var(--azul-esc)}
.q-src{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); letter-spacing:.03em}
.q-stem{font-size:16.5px; color:var(--ink); margin-bottom:15px; line-height:1.58}
.alts{display:grid; gap:7px}
.alt{display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left; padding:11px 14px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); transition:border-color .2s, background .2s, transform .2s; font-size:15.5px; color:var(--ink-2); line-height:1.5}
.alt:hover:not(:disabled){border-color:var(--rosa); background:var(--rosa-wash); transform:translateX(3px)}
.alt:disabled{cursor:default}
.alt .l{flex:none; width:22px; height:22px; border-radius:6px; display:grid; place-items:center; font-family:var(--mono); font-size:11.5px; font-weight:600; background:var(--surface-2); color:var(--ink-3); border:1px solid var(--line); transition:all .2s}
.alt.right{border-color:var(--ok); background:var(--ok-wash); color:var(--ok)}
.alt.right .l{background:var(--ok); color:#fff; border-color:var(--ok)}
.alt.wrong{border-color:var(--crit); background:var(--crit-wash); color:var(--crit)}
.alt.wrong .l{background:var(--crit); color:#fff; border-color:var(--crit)}
.alt.dim{opacity:.5}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(3px)}50%{transform:translateX(-3px)}}
.alt.shake{animation:shake .38s}

/* barra de ações + dica */
.qbar{display:flex; gap:8px; flex-wrap:wrap; margin-top:13px; align-items:center}
.btn{font-family:var(--display); font-weight:600; font-size:13.5px; padding:8px 15px; border-radius:9px; border:1.5px solid var(--line); color:var(--ink-2); display:inline-flex; align-items:center; gap:7px; transition:all .2s}
.btn:hover{border-color:var(--rosa); color:var(--rosa); transform:translateY(-1px)}
.btn.pri{background:var(--rosa); border-color:var(--rosa); color:#fff}
.btn.pri:hover{background:var(--rosa-esc); border-color:var(--rosa-esc); color:#fff}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none; border-color:var(--line); color:var(--ink-3)}
.dica{margin-top:11px; padding:12px 16px; border-radius:11px; background:var(--alerta-wash); border-left:3px solid var(--alerta); color:var(--alerta); font-size:15.5px; line-height:1.55; animation:unfold .34s cubic-bezier(.22,.9,.28,1) both}

/* questão aberta */
.resp{width:100%; resize:vertical; font:inherit; font-size:16px; line-height:1.55; color:var(--ink); background:var(--surface); border:1.5px solid var(--line); border-radius:11px; padding:13px 15px; min-height:120px; transition:border-color .2s}

.crit.miss .mk{background:var(--line-2); color:var(--surface)}
.gab{margin-top:12px; padding:16px 19px; border-radius:11px; background:var(--surface-2); border-left:3px solid var(--ok); font-size:15.5px; color:var(--ink-2); line-height:1.65; animation:unfold .36s both}

/* fontes */
